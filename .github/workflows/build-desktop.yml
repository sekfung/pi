name: Build Desktop

on:
  pull_request:
    paths:
      - 'packages/gui/**'
      - 'packages/protocol/**'
      - 'packages/coding-agent/**'
      - '.github/workflows/build-desktop.yml'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            bundles: deb,appimage
          - name: macOS arm64
            os: macos-14
            bundles: dmg
          - name: Windows x64
            os: windows-2025
            bundles: nsis
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build desktop installers
        run: npm --prefix packages/gui run tauri -- build --bundles ${{ matrix.bundles }} --ci

      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pi-desktop-${{ runner.os }}-${{ runner.arch }}
          path: packages/gui/src-tauri/target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 14
