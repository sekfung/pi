[package]
name = "pi-gui"
version = "0.84.1"
edition = "2021"

[lib]
name = "pi_gui"
path = "src/lib.rs"

[[bin]]
name = "pi-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
tauri = "=2.11.5"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-shell = "=2.3.5"
tokio = { version = "=1.53.1", features = ["sync"] }
